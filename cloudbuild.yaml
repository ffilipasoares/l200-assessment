steps:
  # 1. Automated Evaluation Suite (Fail fast if logic is broken)
  - name: 'python:3.9'
    entrypoint: python3
    args: 
      - '-m'
      - 'pytest'
      - 'l200-assessment/eval_agent.py'

  # 2. Containerization: Build and Push the Agent image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/meal-planner-agent:latest', 'l200-assessment']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/meal-planner-agent:latest']

  # 3. Infrastructure as Code: Provisioning & Declarative Deployment
  # This replaces the imperative 'gcloud run deploy' command
  - name: 'hashicorp/terraform'
    dir: 'l200-assessment'
    args: ['init']
  - name: 'hashicorp/terraform'
    dir: 'l200-assessment'
    args: ['apply', '-auto-approve', '-var=project_id=$PROJECT_ID']
